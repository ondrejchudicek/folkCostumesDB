services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # change in prod
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: costumes
    ports:
      # remove in prod or change to 127.0.0.1:5432:5432
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
